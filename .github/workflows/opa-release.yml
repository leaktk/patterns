name: Build and Release OPA Bundle

on:
  push:
    branches:
      - main
    paths:
      - 'src/patterns/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Install Minisign and JQ
        run: sudo apt-get install -y minisign jq

      - name: Generate Capabilities JSON
        run: |
          opa capabilities --current > base_caps.json
          cat base_caps.json | jq '.builtins += [
            {
              "name": "leaktk.ai.RunModel",
              "decl": {
                "type": "function",
                "args": [
                  {"type": "string"},
                  {"type": "any"}
                ],
                "result": {"type": "any"}
              }
            }
          ]' > capabilities.json
          rm base_caps.json

      - name: Build OPA Bundle
        run: |
          opa build -b src/patterns/ --capabilities capabilities.json -o bundle.tar.gz

      - name: Get Signing Secrets
        # https://bitwarden.com/help/github-actions-integration/
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # pin@v3.0.1
        with:
          access_token: ${{ secrets.LEAKTK_BUNDLES_RELEASE_BW_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            6f512d52-43e2-4fa0-9fc8-b4c200e318c7 > LEAKTK_BUNDLES_MINISIGN_PRIVATE_KEY
            4543f27a-2245-4213-a8cd-b4c200e3421c > LEAKTK_BUNDLES_MINISIGN_PRIVATE_KEY_PASSWORD

      - name: Sign OPA Bundle with Minisign
        run: |
          echo "$LEAKTK_BUNDLES_MINISIGN_PRIVATE_KEY" > minisign.key
          echo "$LEAKTK_BUNDLES_MINISIGN_PRIVATE_KEY_PASSWORD" | minisign -S -s minisign.key -m bundle.tar.gz
          rm -f minisign.key

      - name: Create GitHub Release with Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: OPA Bundle Release v${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            bundle.tar.gz
            bundle.tar.gz.minisig
