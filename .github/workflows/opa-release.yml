name: Build and Release OPA Bundle

on:
  push:
    branches:
      - main
    paths:
      - 'src/patterns/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Install Minisign and JQ
        run: sudo apt-get install -y minisign jq

      - name: Generate Capabilities JSON
        run: |
          opa capabilities --current > base_caps.json
          cat base_caps.json | jq '.builtins += [
            {
              "name": "leaktk.ai.RunModel",
              "decl": {
                "type": "function",
                "args": [
                  {"type": "string"},
                  {"type": "any"}
                ],
                "result": {"type": "any"}
              }
            }
          ]' > capabilities.json
          rm base_caps.json

      - name: Build OPA Bundle
        run: |
          opa build -b src/patterns/ --capabilities capabilities.json -o bundle.tar.gz

      - name: Sign OPA Bundle with Minisign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          echo "$MINISIGN_KEY" > minisign.key
          minisign -S -s minisign.key -m bundle.tar.gz
          rm -f minisign.key

      - name: Create GitHub Release with Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: OPA Bundle Release v${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            bundle.tar.gz
            bundle.tar.gz.minisig
